name: Clubee-Sync

on:
  # GitHub rechnet in UTC. Beide Zeiten laufen an, das Skript läuft aber nur,
  # wenn es in Wien gerade 12 Uhr ist (Sommer- und Winterzeit abgedeckt).
  schedule:
    - cron: "0 10 * * 3"   # Mittwoch 12:00 Wien (Sommerzeit)
    - cron: "0 11 * * 3"   # Mittwoch 12:00 Wien (Winterzeit)
  # Manueller Start durch einen Admin: Actions → Clubee-Sync → Run workflow
  workflow_dispatch:
    inputs:
      season_id:
        description: "Saison-ID (leer = Standard aus den Repo-Variablen)"
        required: false
        default: ""
      force:
        description: "Plausibilitätsprüfung überspringen"
        type: boolean
        default: false
      rebuild_history:
        description: "Archiv vergangener Saisons neu laden"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: clubee-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Uhrzeit prüfen (nur bei geplantem Lauf)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Europe/Vienna date +%H)" != "12" ]; then
            echo "Nicht 12 Uhr in Wien – dieser Lauf wird übersprungen."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "20"

      - name: Daten aus Clubee holen
        if: steps.gate.outputs.run == 'true'
        env:
          CLUBEE_TOKEN: ${{ secrets.CLUBEE_TOKEN }}
          CLUBEE_WEBSITE: ${{ vars.CLUBEE_WEBSITE || 'afbo' }}
          COMPETITION_ID: ${{ vars.COMPETITION_ID || '13931' }}
          SEASON_ID: ${{ inputs.season_id || vars.SEASON_ID || '217' }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          REBUILD_HISTORY: ${{ inputs.rebuild_history && 'true' || 'false' }}
        run: node scripts/sync.mjs

      - name: Änderungen speichern
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "afl-sync-bot"
          git config user.email "afl-sync-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Clubee-Sync $(TZ=Europe/Vienna date '+%d.%m.%Y %H:%M')"
            git push
          fi
